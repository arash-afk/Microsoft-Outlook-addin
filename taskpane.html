<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Save to SharePoint</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; padding: 16px; }
    button {
      padding: 10px 18px;
      font-size: 14px;
      cursor: pointer;
      background: #2b579a;
      color: white;
      border: none;
      border-radius: 4px;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    #status { margin-top: 14px; font-size: 13px; color: #333; }
  </style>
</head>
<body>
  <label for="msgIdInput" style="display:block; font-size:13px; margin-bottom:4px;">Message ID (editable for testing)</label>
  <input id="msgIdInput" type="text" style="width:100%; box-sizing:border-box; padding:6px; font-size:12px; margin-bottom:10px;" />

  <button id="saveBtn">Save to SharePoint</button>
  <div id="status"></div>

  <script>
    // REPLACE this with the HTTP POST URL from your "When a HTTP request is received" trigger
    const FLOW_URL = "https://defaulta42b9ac47fa241d89839d24966a8f0.d0.environment.api.powerplatform.com/powerautomate/automations/direct/cu/24/workflows/673e2e2d90ef4e8cbc4256dc371b4efc/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=VNDxXYaWFc_fxWC-DuJLciNEAZSUpRcOijxHpJTCxVA";

    Office.onReady(() => {
      // Pre-fill the input with the auto-detected ID of the open message,
      // but leave it editable so you can paste in a different ID for testing.
      try {
        const autoId = Office.context.mailbox.convertToRestId(
          Office.context.mailbox.item.itemId,
          Office.MailboxEnums.RestVersion.v2_0
        );
        document.getElementById("msgIdInput").value = autoId;
      } catch (e) {
        document.getElementById("status").textContent = "Could not auto-detect ID: " + e.message;
      }

      document.getElementById("saveBtn").onclick = saveToSharePoint;
    });

    function saveToSharePoint() {
      const btn = document.getElementById("saveBtn");
      const status = document.getElementById("status");
      btn.disabled = true;
      status.textContent = "Saving...";

      // Use whatever is currently in the text box, whether that's the
      // auto-filled value or something you pasted in manually.
      const restId = document.getElementById("msgIdInput").value.trim();

      fetch(FLOW_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messageId: restId })
      })
        .then((res) => res.json().catch(() => ({})))
        .then((data) => {
          status.textContent = "Done: " + (data.result || "request sent, check SharePoint");
        })
        .catch((err) => {
          status.textContent = "Error: " + err.message;
        })
        .finally(() => {
          btn.disabled = false;
        });
    }
  </script>
</body>
</html>
