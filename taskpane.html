<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Correspondence Archive</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    :root {
      --ink: #1F2328;
      --ink-muted: #5B6470;
      --border: #D8DCE1;
      --primary: #1B2A4A;
      --primary-hover: #142038;
      --surface: #FFFFFF;
      --surface-muted: #F5F6F8;
      --success: #2E7D32;
      --success-bg: #EDF7ED;
      --error: #B3261E;
      --error-bg: #FBEAE9;
      --star: #B7791F;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      color: var(--ink);
      margin: 0;
      padding: 16px;
      font-size: 13px;
      background: var(--surface);
    }
    h1 {
      font-size: 15px;
      font-weight: 600;
      margin: 0 0 12px 0;
    }
    h2 {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-muted);
      margin: 0 0 6px 0;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .email-context {
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 16px;
    }
    .email-context .subject {
      font-weight: 600;
      margin-bottom: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .email-context .sender {
      color: var(--ink-muted);
      font-size: 12px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .step {
      display: inline-block;
      min-width: 18px;
      height: 18px;
      line-height: 18px;
      text-align: center;
      border-radius: 9px;
      background: var(--primary);
      color: #fff;
      font-size: 11px;
      margin-right: 6px;
    }
    .field { margin-bottom: 16px; position: relative; }
    .field.disabled label { color: var(--ink-muted); }
    .field.disabled .step { background: var(--border); color: var(--ink-muted); }
    input[type="text"], select {
      width: 100%;
      padding: 7px 9px;
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: 5px;
      font-family: inherit;
      color: var(--ink);
      background: var(--surface);
    }
    input[type="text"]:disabled, select:disabled {
      background: var(--surface-muted);
      cursor: not-allowed;
    }
    input[type="text"]:focus, select:focus, button:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 1px;
    }
    .row { display: flex; gap: 6px; align-items: center; }
    .row select { flex: 1; min-width: 0; }
    .hint {
      font-size: 11px;
      color: var(--ink-muted);
      margin-top: 4px;
    }

    /* Favourite star toggle */
    button.star {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--surface);
      color: var(--ink-muted);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      padding: 0;
    }
    button.star[aria-pressed="true"] { color: var(--star); }
    button.star:disabled { opacity: 0.4; cursor: not-allowed; }
    button.star.small {
      width: auto;
      height: auto;
      border: none;
      background: none;
      font-size: 15px;
      padding: 0 2px;
    }

    /* Favourites list */
    .favourites { margin-bottom: 16px; }
    .fav-list { display: flex; flex-direction: column; gap: 4px; }
    .fav {
      display: flex;
      align-items: stretch;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--surface);
      overflow: hidden;
    }
    .fav button.fav-go {
      flex: 1;
      min-width: 0;
      text-align: left;
      border: none;
      background: none;
      padding: 7px 9px;
      font-family: inherit;
      font-size: 13px;
      color: var(--ink);
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .fav button.fav-go:hover:not(:disabled) { background: var(--surface-muted); }
    .fav button.fav-go:disabled { color: var(--ink-muted); cursor: default; }
    .fav .fav-icon { color: var(--star); margin-right: 6px; }
    .fav .fav-site { color: var(--ink-muted); }
    .fav .fav-note { color: var(--ink-muted); font-size: 11px; margin-left: 4px; }
    .fav button.fav-remove {
      border: none;
      border-left: 1px solid var(--border);
      background: none;
      color: var(--ink-muted);
      width: 32px;
      font-size: 15px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .fav button.fav-remove:hover { background: var(--error-bg); color: var(--error); }
    .fav-empty { font-size: 12px; color: var(--ink-muted); }

    .folder-list {
      border: 1px solid var(--border);
      border-radius: 5px;
      margin-top: 4px;
      max-height: 160px;
      overflow-y: auto;
      display: none;
    }
    .folder-list.open { display: block; }
    .folder-option {
      padding: 7px 9px;
      cursor: pointer;
    }
    .folder-option:hover, .folder-option.active {
      background: var(--surface-muted);
    }
    .folder-empty {
      padding: 8px 9px;
      color: var(--ink-muted);
    }
    .folder-empty button, .folder-create button, .link-btn {
      background: none;
      border: none;
      color: var(--primary);
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      font-size: 12px;
      text-decoration: underline;
      font-family: inherit;
    }
    .folder-create {
      padding: 7px 9px;
      border-top: 1px solid var(--border);
    }
    .selected-folder {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 7px 9px;
      margin-top: 4px;
    }
    .selected-folder span {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .selected-folder button.change {
      background: none;
      border: none;
      color: var(--ink-muted);
      cursor: pointer;
      font-size: 12px;
      padding: 0;
      flex-shrink: 0;
      font-family: inherit;
    }
    button.primary {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    button.primary:hover:not(:disabled) { background: var(--primary-hover); }
    button.primary:disabled {
      background: var(--border);
      color: var(--ink-muted);
      cursor: not-allowed;
    }
    .status {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 5px;
      font-size: 12px;
      display: none;
    }
    .status.visible { display: block; }
    .status.success { background: var(--success-bg); color: var(--success); }
    .status.error { background: var(--error-bg); color: var(--error); }
    .status.pending { background: var(--surface-muted); color: var(--ink-muted); }
    details {
      margin-top: 20px;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }
    summary {
      font-size: 12px;
      color: var(--ink-muted);
      cursor: pointer;
    }
    details[open] summary { margin-bottom: 8px; }
    details label { font-weight: 400; color: var(--ink-muted); }
    details .link-btn { margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Correspondence Archive</h1>

  <div class="email-context">
    <div class="subject" id="emailSubject">Loading email...</div>
    <div class="sender" id="emailSender"></div>
  </div>

  <section class="favourites" id="favSection" hidden>
    <h2>Favourites</h2>
    <div class="fav-list" id="favList"></div>
  </section>

  <div class="field" id="siteField">
    <label for="siteSelect"><span class="step">1</span>Site</label>
    <div class="row">
      <select id="siteSelect" disabled><option value="">Checking your access...</option></select>
      <button type="button" class="star" id="siteStar" aria-pressed="false" disabled
              title="Add this site to favourites" aria-label="Add this site to favourites">&#9734;</button>
    </div>
  </div>

  <div class="field disabled" id="folderField">
    <label for="folderFilter"><span class="step">2</span>Folder</label>
    <input id="folderFilter" type="text" placeholder="Choose a site first" autocomplete="off" disabled />
    <div id="folderList" class="folder-list"></div>
    <div id="selectedFolderDisplay"></div>
    <div class="hint">The email and each attachment are saved as separate files in this folder.</div>
  </div>

  <button id="saveBtn" class="primary" disabled>Choose a site to continue</button>
  <div id="status" class="status" role="status"></div>

  <details>
    <summary>Advanced</summary>
    <label for="msgIdInput">Message ID (for troubleshooting)</label>
    <input id="msgIdInput" type="text" />
    <button type="button" class="link-btn" id="refreshAccessBtn">Refresh my site access</button>
  </details>

  <script>
    // ------------------------------------------------------------------
    // 1. FLOW URLS -- paste the HTTP trigger URL of each flow here.
    // ------------------------------------------------------------------
    const SAVE_FLOW_URL = "https://defaulta42b9ac47fa241d89839d24966a8f0.d0.environment.api.powerplatform.com/powerautomate/automations/direct/cu/24/workflows/673e2e2d90ef4e8cbc4256dc371b4efc/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=VNDxXYaWFc_fxWC-DuJLciNEAZSUpRcOijxHpJTCxVA";
    const LIST_FOLDERS_URL = "https://defaulta42b9ac47fa241d89839d24966a8f0.d0.environment.api.powerplatform.com/powerautomate/automations/direct/cu/19/workflows/9c5e00569e094b7da756ea4562b417a0/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=Yg7NjEIH4-kHYrmbzRdp78YX1WZ8WL0e4U_Rmiv7Qk4";
    const CREATE_FOLDER_URL = "https://defaulta42b9ac47fa241d89839d24966a8f0.d0.environment.api.powerplatform.com/powerautomate/automations/direct/cu/14/workflows/5f219e8ed99943d2b81303042a1b0af2/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=GRHRyFTgQ8LHWHZsCilywcLEEP32csuta13gR-ImJig";
    const CHECK_SITE_URL = "https://defaulta42b9ac47fa241d89839d24966a8f0.d0.environment.api.powerplatform.com/powerautomate/automations/direct/cu/05/workflows/27d9c4d19020477b94e280fa197b3fe7/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=AKvYeiAPA1A7tVRNoAwbrOz-_edr0cZw3wFutOVyxdk";

    // ------------------------------------------------------------------
    // 2. SITES -- the full list. Each person only sees the sites they
    //    have access to in SharePoint.
    //    name    : what lawyers see in the dropdown
    //    siteUrl : full site address, no trailing slash
    //    library : the document library's URL name, exactly as it appears
    //              in the browser address bar after the site address
    //              (e.g. "Client Correspondence", or "Shared Documents"
    //              for the default "Documents" library)
    //    Every library listed here needs the columns in UPGRADE-GUIDE.md, part A.
    // ------------------------------------------------------------------
    const SITES = [
      { name: "Neota", siteUrl: "https://cookiepot.sharepoint.com/sites/Neota", library: "Client Correspondence" },
      { name: "Site 02", siteUrl: "https://cookiepot.sharepoint.com/sites/SITE02", library: "Client Correspondence" },
      // { name: "Site 03", siteUrl: "https://cookiepot.sharepoint.com/sites/SITE03", library: "Client Correspondence" },
      // { name: "Site 04", siteUrl: "https://cookiepot.sharepoint.com/sites/SITE04", library: "Client Correspondence" },
      // { name: "Site 05", siteUrl: "https://cookiepot.sharepoint.com/sites/SITE05", library: "Client Correspondence" },
      // { name: "Site 06", siteUrl: "https://cookiepot.sharepoint.com/sites/SITE06", library: "Client Correspondence" },
      // { name: "Site 07", siteUrl: "https://cookiepot.sharepoint.com/sites/SITE07", library: "Client Correspondence" },
      // { name: "Site 08", siteUrl: "https://cookiepot.sharepoint.com/sites/SITE08", library: "Client Correspondence" },
      // { name: "Site 09", siteUrl: "https://cookiepot.sharepoint.com/sites/SITE09", library: "Client Correspondence" },
      // { name: "Site 10", siteUrl: "https://cookiepot.sharepoint.com/sites/SITE10", library: "Client Correspondence" },
      // { name: "Site 11", siteUrl: "https://cookiepot.sharepoint.com/sites/SITE11", library: "Client Correspondence" },
      // { name: "Site 12", siteUrl: "https://cookiepot.sharepoint.com/sites/SITE12", library: "Client Correspondence" },
      // { name: "Site 13", siteUrl: "https://cookiepot.sharepoint.com/sites/SITE13", library: "Client Correspondence" },
      // { name: "Site 14", siteUrl: "https://cookiepot.sharepoint.com/sites/SITE14", library: "Client Correspondence" },
      // { name: "Site 15", siteUrl: "https://cookiepot.sharepoint.com/sites/SITE15", library: "Client Correspondence" },
      // { name: "Site 16", siteUrl: "https://cookiepot.sharepoint.com/sites/SITE16", library: "Client Correspondence" },
      // { name: "Site 17", siteUrl: "https://cookiepot.sharepoint.com/sites/SITE17", library: "Client Correspondence" },
      // { name: "Site 18", siteUrl: "https://cookiepot.sharepoint.com/sites/SITE18", library: "Client Correspondence" },
      // { name: "Site 19", siteUrl: "https://cookiepot.sharepoint.com/sites/SITE19", library: "Client Correspondence" },
      // { name: "Site 20", siteUrl: "https://cookiepot.sharepoint.com/sites/SITE20", library: "Client Correspondence" },
    ];

    // ------------------------------------------------------------------
    // 3. OTHER SETTINGS
    // ------------------------------------------------------------------
    const MAX_FAVOURITES = 5;
    // How long this computer remembers which sites a person can open.
    // Folder lists, new folders and saves are always checked live.
    const SITE_ACCESS_CACHE_HOURS = 12;

    // Characters SharePoint rejects in names, plus # and % which break the REST call that creates folders.
    const INVALID_FOLDER_CHARS = /["*:<>?\/\\|#%]/;
    const LAST_SITE_KEY = "archive.lastSiteUrl";
    const SITE_ACCESS_KEY = "archive.siteAccess.v1";
    const FAVOURITES_KEY = "favourites"; // stored in the user's mailbox (Office roaming settings)

    let userEmail = "";
    let allowedSites = [];       // entries of SITES this person can open
    let selectedSite = null;     // one entry of SITES
    let allFolders = [];         // [{ Name, Path }] for the selected site
    let selectedFolder = null;   // { Name, Path }
    let folderLoadToken = 0;     // ignores stale responses if the site changes mid-load
    const folderCache = {};      // siteUrl -> folders, so switching back is instant
    let favourites = [];         // [{ type: "site"|"folder", siteUrl, siteName, folderName?, folderPath? }]
    let favouritesAvailable = true;

    Office.onReady(() => {
      const item = Office.context.mailbox.item;
      document.getElementById("emailSubject").textContent = item.subject || "(no subject)";
      document.getElementById("emailSender").textContent =
        (item.from && item.from.displayName) ? "From " + item.from.displayName : "";
      userEmail = (Office.context.mailbox.userProfile.emailAddress || "").trim().toLowerCase();

      try {
        const autoId = Office.context.mailbox.convertToRestId(item.itemId, Office.MailboxEnums.RestVersion.v2_0);
        document.getElementById("msgIdInput").value = autoId;
      } catch (e) {
        showStatus("error", "Could not read this message's ID. Try reopening the email.");
      }

      document.getElementById("siteSelect").onchange = () => onSiteChange();
      document.getElementById("siteStar").onclick = toggleSiteFavourite;
      document.getElementById("saveBtn").onclick = saveToSharePoint;
      document.getElementById("refreshAccessBtn").onclick = refreshAccess;
      document.getElementById("folderFilter").oninput = renderFolderList;
      document.getElementById("folderFilter").onfocus = renderFolderList;
      document.getElementById("folderFilter").onkeydown = (e) => {
        if (e.key === "Escape") document.getElementById("folderList").classList.remove("open");
      };
      document.addEventListener("click", (e) => {
        if (!e.target.closest("#folderField")) {
          document.getElementById("folderList").classList.remove("open");
        }
      });

      loadFavourites();
      loadSiteAccess(false);
    });

    // ================= Site access (which sites this person can see) =================

    function sitesKey() {
      return SITES.map((s) => s.siteUrl.toLowerCase() + "|" + s.library).sort().join(",");
    }

    function readAccessCache() {
      try {
        const c = JSON.parse(window.localStorage.getItem(SITE_ACCESS_KEY) || "null");
        if (!c || c.email !== userEmail || c.sites !== sitesKey()) return null;
        if (Date.now() - c.at > SITE_ACCESS_CACHE_HOURS * 3600 * 1000) return null;
        return c.allowed;
      } catch (e) { return null; }
    }

    function writeAccessCache(allowedUrls) {
      try {
        window.localStorage.setItem(SITE_ACCESS_KEY, JSON.stringify({
          email: userEmail, sites: sitesKey(), at: Date.now(), allowed: allowedUrls
        }));
      } catch (e) { /* storage blocked: we'll just check again next time */ }
    }

    function loadSiteAccess(force) {
      const select = document.getElementById("siteSelect");
      select.disabled = true;
      select.innerHTML = '<option value="">Checking your access...</option>';

      const cached = force ? null : readAccessCache();
      if (cached) {
        applySiteAccess(cached, 0);
        return;
      }

      if (!/^https:\/\//.test(CHECK_SITE_URL)) {
        select.innerHTML = '<option value="">Not set up yet</option>';
        showStatus("error", "Site access check isn't set up: CHECK_SITE_URL is missing in taskpane.html (UPGRADE-GUIDE.md, part G).");
        return;
      }

      // One check per site, all at once. Anything that fails counts as "no access".
      Promise.all(SITES.map((s) =>
        postJson(CHECK_SITE_URL, { userEmail: userEmail, siteUrl: s.siteUrl, library: s.library })
          .then((d) => ({ url: s.siteUrl, ok: !!(d && d.allowed === true), failed: false }))
          .catch(() => ({ url: s.siteUrl, ok: false, failed: true }))
      )).then((results) => {
        const allowed = results.filter((r) => r.ok).map((r) => r.url);
        const failed = results.filter((r) => r.failed).length;
        if (failed === 0) writeAccessCache(allowed); // don't remember a partial answer
        applySiteAccess(allowed, failed);
      });
    }

    function applySiteAccess(allowedUrls, failedCount) {
      allowedSites = SITES.filter((s) => allowedUrls.indexOf(s.siteUrl) !== -1);
      renderSiteOptions();
      renderFavourites();

      if (failedCount > 0) {
        showStatus("error", "Couldn't check your access to " + failedCount + " site(s), so they're hidden. " +
          "Try \"Refresh my site access\" under Advanced, or ask your admin to check the Check site access flow.");
      }
      if (allowedSites.length === 0) {
        if (!failedCount) showStatus("error", "You don't have access to any of the filing sites. Ask your admin.");
        return;
      }

      // Reopen on the site this person used last time, if they can still see it.
      const last = readLastSite();
      if (!selectedSite && allowedSites.some((s) => s.siteUrl === last)) setSite(last);
    }

    function refreshAccess() {
      try { window.localStorage.removeItem(SITE_ACCESS_KEY); } catch (e) { /* ignore */ }
      Object.keys(folderCache).forEach((k) => delete folderCache[k]);
      selectedSite = null;
      selectedFolder = null;
      renderSelectedFolder();
      onSiteChange();
      hideStatus();
      loadSiteAccess(true);
    }

    // ================= Step 1: site =================

    function renderSiteOptions() {
      const select = document.getElementById("siteSelect");
      select.innerHTML = "";
      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = allowedSites.length ? "Select a site..." : "No sites available";
      select.appendChild(placeholder);

      allowedSites.slice()
        .sort((a, b) => a.name.localeCompare(b.name))
        .forEach((s) => {
          const opt = document.createElement("option");
          opt.value = s.siteUrl;
          opt.textContent = s.name;
          select.appendChild(opt);
        });
      select.disabled = allowedSites.length === 0;
      if (selectedSite) select.value = selectedSite.siteUrl;
    }

    // Select a site programmatically (favourites, last used). Returns the folder-load promise.
    function setSite(siteUrl) {
      document.getElementById("siteSelect").value = siteUrl;
      return onSiteChange();
    }

    function onSiteChange() {
      const url = document.getElementById("siteSelect").value;
      selectedSite = allowedSites.find((s) => s.siteUrl === url) || null;
      selectedFolder = null;
      allFolders = [];
      renderSelectedFolder();
      renderStars();

      const filter = document.getElementById("folderFilter");
      const field = document.getElementById("folderField");
      filter.value = "";
      document.getElementById("folderList").classList.remove("open");

      if (!selectedSite) {
        filter.disabled = true;
        filter.placeholder = "Choose a site first";
        field.classList.add("disabled");
        updateSaveButtonState();
        return Promise.resolve([]);
      }

      writeLastSite(selectedSite.siteUrl);
      field.classList.remove("disabled");
      updateSaveButtonState();
      return loadFolders(selectedSite);
    }

    // ================= Step 2: folder =================

    function loadFolders(site) {
      const filter = document.getElementById("folderFilter");

      if (folderCache[site.siteUrl]) {
        allFolders = folderCache[site.siteUrl];
        filter.disabled = false;
        filter.placeholder = "Search folders in " + site.name + "...";
        return Promise.resolve(allFolders);
      }

      const token = ++folderLoadToken;
      filter.disabled = true;
      filter.placeholder = "Loading folders...";

      return postJson(LIST_FOLDERS_URL, { userEmail: userEmail, siteUrl: site.siteUrl, library: site.library })
        .then((folders) => {
          const list = (Array.isArray(folders) ? folders : [])
            .sort((a, b) => a.Name.localeCompare(b.Name));
          folderCache[site.siteUrl] = list;
          if (token === folderLoadToken) {
            allFolders = list;
            filter.disabled = false;
            filter.placeholder = list.length ? "Search folders in " + site.name + "..." : "Type a name to create a folder";
          }
          return list;
        })
        .catch((err) => {
          if (token === folderLoadToken) {
            filter.disabled = false;
            filter.placeholder = "Couldn't load folders";
            showStatus("error", "Couldn't load folders: " + err.message);
          }
          throw err;
        });
    }

    function renderFolderList() {
      if (!selectedSite) return;
      const raw = document.getElementById("folderFilter").value.trim();
      const query = raw.toLowerCase();
      const listEl = document.getElementById("folderList");
      const matches = allFolders.filter((f) => f.Name.toLowerCase().includes(query));
      const exact = allFolders.some((f) => f.Name.toLowerCase() === query);

      listEl.innerHTML = "";

      matches.forEach((f) => {
        const opt = document.createElement("div");
        opt.className = "folder-option";
        opt.textContent = f.Name;
        opt.onclick = () => selectFolder(f);
        listEl.appendChild(opt);
      });

      if (raw && !exact) {
        const row = document.createElement("div");
        row.className = matches.length ? "folder-create" : "folder-empty";
        const prefix = matches.length ? "" : "No matching folder. ";
        row.innerHTML = prefix + '<button type="button">Create "' + escapeHtml(raw) + '" in ' +
          escapeHtml(selectedSite.name) + '</button>';
        row.querySelector("button").onclick = () => createFolder(raw);
        listEl.appendChild(row);
      }

      if (!raw && matches.length === 0) {
        const empty = document.createElement("div");
        empty.className = "folder-empty";
        empty.textContent = "No folders you can access here yet. Type a name to create one.";
        listEl.appendChild(empty);
      }

      listEl.classList.add("open");
    }

    function selectFolder(folder) {
      selectedFolder = folder;
      document.getElementById("folderFilter").value = "";
      document.getElementById("folderList").classList.remove("open");
      renderSelectedFolder();
      updateSaveButtonState();
    }

    function renderSelectedFolder() {
      const el = document.getElementById("selectedFolderDisplay");
      el.innerHTML = "";
      if (!selectedFolder) {
        renderStars();
        return;
      }
      const box = document.createElement("div");
      box.className = "selected-folder";

      const name = document.createElement("span");
      name.textContent = selectedFolder.Name;

      const star = document.createElement("button");
      star.type = "button";
      star.className = "star small";
      star.id = "folderStar";
      star.onclick = toggleFolderFavourite;

      const change = document.createElement("button");
      change.type = "button";
      change.className = "change";
      change.textContent = "Change";
      change.onclick = () => {
        selectedFolder = null;
        renderSelectedFolder();
        updateSaveButtonState();
        document.getElementById("folderFilter").focus();
      };

      box.appendChild(name);
      box.appendChild(star);
      box.appendChild(change);
      el.appendChild(box);
      renderStars();
    }

    function validateFolderName(name) {
      if (!name) return "Enter a folder name.";
      if (INVALID_FOLDER_CHARS.test(name)) return 'Folder names can\'t contain " * : < > ? / \\ | # %';
      if (/\.$/.test(name)) return "Folder names can't end with a full stop.";
      if (name.length > 120) return "Keep folder names under 120 characters.";
      return null;
    }

    function createFolder(name) {
      const site = selectedSite;
      const problem = validateFolderName(name);
      if (problem) {
        showStatus("error", problem);
        return;
      }

      showStatus("pending", "Creating folder in " + site.name + "...");
      postJson(CREATE_FOLDER_URL, { userEmail: userEmail, siteUrl: site.siteUrl, library: site.library, folderName: name })
        .then((data) => {
          const folder = { Name: (data && data.Name) || name, Path: data && data.Path };
          if (!folder.Path) throw new Error("no path returned");
          const list = folderCache[site.siteUrl] || allFolders;
          if (!list.some((f) => f.Path === folder.Path)) {
            list.push(folder);
            list.sort((a, b) => a.Name.localeCompare(b.Name));
          }
          folderCache[site.siteUrl] = list;
          if (selectedSite === site) {
            allFolders = list;
            selectFolder(folder);
          }
          hideStatus();
        })
        .catch((err) => {
          showStatus("error", "Couldn't create that folder: " + err.message);
        });
    }

    function updateSaveButtonState() {
      const btn = document.getElementById("saveBtn");
      btn.disabled = !(selectedSite && selectedFolder);
      if (!selectedSite) btn.textContent = "Choose a site to continue";
      else if (!selectedFolder) btn.textContent = "Choose a folder to continue";
      else btn.textContent = "Save to " + selectedSite.name + " › " + selectedFolder.Name;
    }

    // ================= Favourites (per user, stored in their mailbox) =================

    function roaming() {
      try { return Office.context.roamingSettings || null; } catch (e) { return null; }
    }

    function loadFavourites() {
      const rs = roaming();
      if (!rs) {
        favouritesAvailable = false;
        renderFavourites();
        renderStars();
        return;
      }
      const stored = rs.get(FAVOURITES_KEY);
      favourites = Array.isArray(stored) ? stored.filter((f) => f && f.siteUrl && (f.type === "site" || f.folderPath)) : [];
      renderFavourites();
      renderStars();
    }

    function saveFavourites(next, onDone) {
      const rs = roaming();
      if (!rs) return;
      const previous = favourites;
      favourites = next;
      renderFavourites();
      renderStars();
      rs.set(FAVOURITES_KEY, next);
      rs.saveAsync((result) => {
        if (result.status !== Office.AsyncResultStatus.Succeeded) {
          favourites = previous;
          renderFavourites();
          renderStars();
          showStatus("error", "Couldn't save your favourites. Try again.");
          return;
        }
        if (onDone) onDone();
      });
    }

    function favKey(f) {
      return f.type === "site"
        ? "site|" + f.siteUrl.toLowerCase()
        : "folder|" + f.siteUrl.toLowerCase() + "|" + String(f.folderPath).toLowerCase();
    }

    function findFavourite(candidate) {
      const key = favKey(candidate);
      return favourites.findIndex((f) => favKey(f) === key);
    }

    function addOrRemoveFavourite(candidate, label) {
      const i = findFavourite(candidate);
      if (i !== -1) {
        saveFavourites(favourites.filter((_, j) => j !== i), () =>
          showStatus("success", "Removed " + label + " from favourites."));
        return;
      }
      if (favourites.length >= MAX_FAVOURITES) {
        showStatus("error", "You can have up to " + MAX_FAVOURITES +
          " favourites. Remove one (the × next to it) and try again.");
        return;
      }
      saveFavourites(favourites.concat([candidate]), () =>
        showStatus("success", "Added " + label + " to favourites."));
    }

    function toggleSiteFavourite() {
      if (!selectedSite) return;
      addOrRemoveFavourite({ type: "site", siteUrl: selectedSite.siteUrl, siteName: selectedSite.name },
        selectedSite.name);
    }

    function toggleFolderFavourite() {
      if (!selectedSite || !selectedFolder) return;
      addOrRemoveFavourite({
        type: "folder", siteUrl: selectedSite.siteUrl, siteName: selectedSite.name,
        folderName: selectedFolder.Name, folderPath: selectedFolder.Path
      }, selectedFolder.Name);
    }

    function removeFavourite(index) {
      const f = favourites[index];
      if (!f) return;
      const label = f.type === "site" ? f.siteName : f.folderName;
      saveFavourites(favourites.filter((_, j) => j !== index), () =>
        showStatus("success", "Removed " + label + " from favourites."));
    }

    function siteFor(fav) {
      return allowedSites.find((s) => s.siteUrl.toLowerCase() === fav.siteUrl.toLowerCase()) || null;
    }

    function renderFavourites() {
      const section = document.getElementById("favSection");
      const list = document.getElementById("favList");
      list.innerHTML = "";
      if (!favouritesAvailable) {
        section.hidden = true;
        return;
      }
      section.hidden = false;

      if (favourites.length === 0) {
        const empty = document.createElement("div");
        empty.className = "fav-empty";
        empty.textContent = "Click ☆ next to a site or folder to add it here (up to " + MAX_FAVOURITES + ").";
        list.appendChild(empty);
        return;
      }

      const accessKnown = document.getElementById("siteSelect").options.length > 0 &&
        document.getElementById("siteSelect").options[0].textContent !== "Checking your access...";

      favourites.forEach((f, index) => {
        const site = siteFor(f);
        const known = SITES.some((s) => s.siteUrl.toLowerCase() === f.siteUrl.toLowerCase());
        const row = document.createElement("div");
        row.className = "fav";

        const go = document.createElement("button");
        go.type = "button";
        go.className = "fav-go";
        const siteName = (site && site.name) || f.siteName || "Site";
        if (f.type === "site") {
          go.innerHTML = '<span class="fav-icon">★</span>' + escapeHtml(siteName) +
            ' <span class="fav-site">(whole site)</span>';
          go.title = siteName;
        } else {
          go.innerHTML = '<span class="fav-icon">★</span><span class="fav-site">' + escapeHtml(siteName) +
            ' › </span>' + escapeHtml(f.folderName);
          go.title = siteName + " › " + f.folderName;
        }
        if (!accessKnown) {
          go.disabled = true;
        } else if (!site) {
          go.disabled = true;
          go.insertAdjacentHTML("beforeend", '<span class="fav-note">' + (known ? "no access" : "site removed") + "</span>");
        } else {
          go.onclick = () => openFavourite(f);
        }

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "fav-remove";
        remove.innerHTML = "&times;";
        remove.title = "Remove from favourites";
        remove.setAttribute("aria-label", "Remove " + (f.type === "site" ? siteName : f.folderName) + " from favourites");
        remove.onclick = () => removeFavourite(index);

        row.appendChild(go);
        row.appendChild(remove);
        list.appendChild(row);
      });
    }

    function openFavourite(f) {
      const site = siteFor(f);
      if (!site) return;
      hideStatus();
      const loading = (selectedSite && selectedSite.siteUrl === site.siteUrl && folderCache[site.siteUrl])
        ? Promise.resolve(folderCache[site.siteUrl])
        : setSite(site.siteUrl);
      if (f.type === "site") {
        loading.catch(() => {});
        document.getElementById("folderFilter").focus();
        return;
      }
      showStatus("pending", "Opening " + f.folderName + "...");
      loading.then((folders) => {
        const match = folders.find((x) => String(x.Path).toLowerCase() === String(f.folderPath).toLowerCase());
        if (!match) {
          showStatus("error", "\"" + f.folderName + "\" isn't available any more. It may have been renamed or deleted, " +
            "or your access changed. You can remove it with the ×.");
          return;
        }
        hideStatus();
        selectFolder(match);
      }).catch(() => { /* loadFolders already showed the error */ });
    }

    function renderStars() {
      const siteStar = document.getElementById("siteStar");
      setStar(siteStar, favouritesAvailable && !!selectedSite,
        selectedSite && findFavourite({ type: "site", siteUrl: selectedSite.siteUrl }) !== -1, "this site");

      const folderStar = document.getElementById("folderStar");
      if (folderStar) {
        setStar(folderStar, favouritesAvailable && !!(selectedSite && selectedFolder),
          !!(selectedSite && selectedFolder) &&
          findFavourite({ type: "folder", siteUrl: selectedSite.siteUrl, folderPath: selectedFolder.Path }) !== -1,
          "this folder");
        folderStar.hidden = !favouritesAvailable;
      }
    }

    function setStar(btn, enabled, on, what) {
      btn.disabled = !enabled;
      btn.setAttribute("aria-pressed", on ? "true" : "false");
      btn.innerHTML = on ? "&#9733;" : "&#9734;";
      const label = on ? "Remove " + what + " from favourites" : "Add " + what + " to favourites";
      btn.title = label;
      btn.setAttribute("aria-label", label);
    }

    // ================= Save =================

    function saveToSharePoint() {
      const btn = document.getElementById("saveBtn");
      btn.disabled = true;
      const site = selectedSite;
      const folder = selectedFolder;
      const where = site.name + " › " + folder.Name;
      showStatus("pending", "Saving email and attachments...");

      postJson(SAVE_FLOW_URL, {
        messageId: document.getElementById("msgIdInput").value.trim(),
        mailboxAddress: Office.context.mailbox.userProfile.emailAddress,
        userEmail: userEmail,
        siteUrl: site.siteUrl,
        library: site.library,
        folderPath: folder.Path
      })
        .then((data) => {
          data = data || {};
          if (data.result === "duplicate") {
            showStatus("success", "Already filed - this email was saved to SharePoint before, so nothing new was added.");
            return;
          }
          const n = Number(data.attachments) || 0;
          const extra = n === 0 ? "" : n === 1 ? " with 1 attachment" : " with " + n + " attachments";
          if (data.warning) {
            showStatus("error", "Saved to " + where + extra + ", but: " + data.warning +
              ". Add the missing column(s) to this library - see UPGRADE-GUIDE.md, part A.");
            return;
          }
          showStatus("success", "Saved to " + where + extra + ".");
        })
        .catch((err) => {
          if (err.status === 502 || err.status === 504) {
            showStatus("pending", "Still saving in the background (large attachments). Check " + where + " in a minute.");
          } else if (!err.status) {
            showStatus("error", "Couldn't reach SharePoint. Check your connection and try again.");
          } else {
            showStatus("error", "Couldn't save: " + err.message);
          }
        })
        .finally(() => {
          updateSaveButtonState();
        });
    }

    // ================= Helpers =================

    function postJson(url, body) {
      return fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body || {})
      }).then((res) =>
        res.text().then((text) => {
          let data = null;
          try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
          if (!res.ok) {
            const msg = (data && (data.message || (data.error && data.error.message))) ||
              "SharePoint returned an error (" + res.status + ").";
            const err = new Error(msg);
            err.status = res.status;
            throw err;
          }
          return data;
        })
      );
    }

    function readLastSite() {
      try { return window.localStorage.getItem(LAST_SITE_KEY); } catch (e) { return null; }
    }

    function writeLastSite(url) {
      try { window.localStorage.setItem(LAST_SITE_KEY, url); } catch (e) { /* storage blocked */ }
    }

    function showStatus(kind, message) {
      const el = document.getElementById("status");
      el.className = "status visible " + kind;
      el.textContent = message;
    }

    function hideStatus() {
      document.getElementById("status").className = "status";
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str == null ? "" : String(str);
      return div.innerHTML;
    }
  </script>
</body>
