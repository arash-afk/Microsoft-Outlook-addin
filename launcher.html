<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neota Launcher</title>
  <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
  <style>
    :root {
      --ink: #0B1F3A;
      --muted: #5A6B82;
      --line: #E2E7EF;
      --bg: #F7F9FC;
      --accent: #094183;
      --accent-press: #062E5C;
      --field: #FFFFFF;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px 18px;
    }
    .eyebrow {
      font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
      color: var(--muted); margin: 0 0 4px;
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 24px; font-weight: 600; margin: 0 0 18px; letter-spacing: -.01em;
    }
    .card {
      background: var(--field); border: 1px solid var(--line); border-radius: 10px;
      padding: 14px; margin-bottom: 18px;
    }
    .row { display: flex; flex-direction: column; gap: 2px; padding: 8px 0; }
    .row + .row { border-top: 1px solid var(--line); }
    .row .label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .row .value { font-size: 14px; word-break: break-word; }
    .value.empty { color: var(--muted); font-style: italic; }
    button {
      width: 100%; border: 0; border-radius: 10px; cursor: pointer;
      background: var(--accent); color: #fff;
      font-size: 15px; font-weight: 600; padding: 13px 16px;
      transition: background .12s ease;
    }
    button:hover { background: var(--accent-press); }
    button:focus-visible { outline: 3px solid #9DC0EE; outline-offset: 2px; }
    .hint { font-size: 12.5px; color: var(--muted); margin: 12px 2px 0; }
    .fallback { font-size: 12.5px; margin: 10px 2px 0; }
    .fallback a { color: var(--accent); }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>
<body>
  <p class="eyebrow">Outlook Add-in</p>
  <h1>Neota</h1>

  <div class="card" id="contextCard">
    <div class="row">
      <span class="label">Signed in as</span>
      <span class="value empty" id="userEmail">Loading…</span>
    </div>
    <div class="row">
      <span class="label">Current message</span>
      <span class="value empty" id="msgSubject">Loading…</span>
    </div>
  </div>

  <button id="openBtn" type="button">Open Neota App</button>

  <p class="hint">Opens in a new browser tab. The Neota app blocks display inside Outlook, so it can't run in this panel.</p>
  <p class="fallback" id="fallback" hidden>
    If nothing opened, your browser may have blocked the tab —
    <a id="fallbackLink" href="#" target="_blank" rel="noopener">open Neota manually</a>.
  </p>

  <script>
    var NEOTA_URL = "https://rc-unimelb.neotalogic.com/a/aarraasshh";

    function setText(id, text) {
      var el = document.getElementById(id);
      el.textContent = text;
      el.classList.remove("empty");
    }

    function openNeota() {
      // Preferred: Office opens it in a top-level browser window (no iframe, no framing block).
      try {
        if (Office.context && Office.context.ui && Office.context.ui.openBrowserWindow) {
          Office.context.ui.openBrowserWindow(NEOTA_URL);
          return;
        }
      } catch (e) { /* fall through */ }

      // Fallback for any client without openBrowserWindow.
      var win = window.open(NEOTA_URL, "_blank", "noopener");
      if (!win) {
        document.getElementById("fallback").hidden = false;
      }
    }

    Office.onReady(function () {
      document.getElementById("fallbackLink").href = NEOTA_URL;
      document.getElementById("openBtn").addEventListener("click", openNeota);

      try {
        var profile = Office.context.mailbox && Office.context.mailbox.userProfile;
        if (profile && profile.emailAddress) setText("userEmail", profile.emailAddress);

        var item = Office.context.mailbox && Office.context.mailbox.item;
        if (item && item.subject) {
          setText("msgSubject", item.subject);
        } else {
          setText("msgSubject", "No message selected");
        }
      } catch (e) {
        // Leave placeholders; the Open button still works regardless.
      }
    });
  </script>
</body>
</html>
